[package]
name = "drin"
version = "0.3.0"
edition = "2024"
description = "DRin - Durian Package Manager"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }

[package.metadata.deb]
maintainer = "RobloxGuest12 roblox222guest.blox@proton.me"
copyright = "2026, RobloxGuest12"
license-file = ["LICENSE", "0"]
extended-description = """
DRin is a fast and lightweight package manager
designed specifically for Ubuntu.
"""
depends = "apt, sudo"
section = "admin"
priority = "optional"